  <style>
    html { overflow-y: auto; }

    h1 { margin: 28px 16px 8px; font-size: clamp(30px, 4vw, 50px); color: #24334b; text-align: center; text-shadow: 2px 3px #fff7e4; }
    .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; width: min(1120px, 92vw); margin: auto; padding: 24px 0 48px; }
    .card { position: relative; display: block; border: 4px solid #24334b; border-radius: 30px; overflow: hidden; background: #fff7e4; box-shadow: 0 8px #24334b; transition: transform .15s; }
    .card svg { display: block; width: 100%; aspect-ratio: 320 / 210; pointer-events: none; }
    .card::after { content: ''; position: absolute; right: 15px; bottom: 14px; width: 46px; height: 46px; border: 3px solid #24334b; border-radius: 50%; background: #fff7e4; box-shadow: 0 3px #24334b; }
    .card::before { content: ''; position: absolute; z-index: 1; right: 30px; bottom: 28px; border-left: 16px solid #24334b; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
    .card:hover { transform: translateY(-5px); }
    .card:active { transform: translateY(5px); }
    @media (max-width: 640px) { .games { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  </style>
</head>
