<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cazaburbujas</title>
    <link rel="stylesheet" href="../assets/common.css" />
    <style>
      body {
        background: linear-gradient(#7dd3fc, #e0f2fe 70%, #bbf7d0);
      }

      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .bubble span {
        pointer-events: none;
      }

      .bubble.popping {
        pointer-events: none;
        transition: transform 0.18s ease-out, opacity 0.18s ease-out;
        opacity: 0;
      }

      .ground {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50px;
        background: #4ade80;
        border-top: 6px solid #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <script src="../assets/common.js"></script>
    <script>
      // Each level makes bubbles smaller, faster and wobblier.
      const LEVELS = [
        { size: 170, speed: 45, max: 3, wobble: 0 },
        { size: 135, speed: 65, max: 4, wobble: 25 },
        { size: 105, speed: 85, max: 5, wobble: 40 },
        { size: 80, speed: 105, max: 6, wobble: 55 },
      ];
      const POPS_PER_LEVEL = 10;
      const SPAWN_EVERY = 0.8; // seconds
      const INSIDE = ["", "", "🐟", "🦋", "⭐", "🐞", "🍓", "🌸"];

      const progress = Juegos.progress(POPS_PER_LEVEL);
      const medals = Juegos.medals();
      Juegos.homeButton();
      Juegos.guardRightClick();

      let level = 0;
      let pops = 0;
      let playing = false;
      let bubbles = [];
      let sinceSpawn = 0;
      let lastTime = 0;

      function spawn() {
        const cfg = LEVELS[level];
        const size = cfg.size * Juegos.random(0.9, 1.1);
        const margin = cfg.wobble + size / 2 + 20;
        const el = document.createElement("div");
        el.className = "bubble bubble-look";
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.fontSize = `${size * 0.4}px`;
        const inside = document.createElement("span");
        inside.textContent = Juegos.pick(INSIDE);
        el.appendChild(inside);

        const bubble = {
          el,
          size,
          baseX: Juegos.random(margin, window.innerWidth - margin),
          y: window.innerHeight,
          x: 0,
          phase: Math.random() * Math.PI * 2,
          speed: cfg.speed * Juegos.random(0.85, 1.15),
          wobble: cfg.wobble,
        };
        // Only the left ("green") button pops a bubble.
        el.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 || !playing) return;
          pop(bubble);
        });
        document.body.appendChild(el);
        bubbles.push(bubble);
      }

      function place(b) {
        b.el.style.transform = `translate(${b.x - b.size / 2}px, ${b.y - b.size / 2}px)`;
      }

      function pop(b) {
        bubbles = bubbles.filter((other) => other !== b);
        b.el.classList.add("popping");
        b.el.style.transform += " scale(1.5)";
        setTimeout(() => b.el.remove(), 200);
        Juegos.sound.pop();
        Juegos.burst(b.x, b.y, "💧", 8);

        pops += 1;
        progress.set(pops);
        if (pops >= POPS_PER_LEVEL) finishLevel();
      }

      async function finishLevel() {
        playing = false;
        bubbles.forEach((b) => b.el.remove());
        bubbles = [];
        const lastLevel = level === LEVELS.length - 1;
        medals.add(lastLevel ? "🏆" : "🏅");
        await Juegos.celebrate(lastLevel ? "🏆" : "🎉");
        level = Math.min(level + 1, LEVELS.length - 1);
        startLevel();
      }

      function startLevel() {
        pops = 0;
        progress.set(0);
        sinceSpawn = SPAWN_EVERY;
        playing = true;
      }

      function loop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        if (playing) {
          sinceSpawn += dt;
          if (sinceSpawn >= SPAWN_EVERY && bubbles.length < LEVELS[level].max) {
            spawn();
            sinceSpawn = 0;
          }
          for (const b of bubbles) {
            b.y -= b.speed * dt;
            b.x = b.baseX + Math.sin(time / 700 + b.phase) * b.wobble;
            place(b);
          }
          // Bubbles that float away just disappear: no penalty, ever.
          const gone = bubbles.filter((b) => b.y < -b.size);
          gone.forEach((b) => b.el.remove());
          bubbles = bubbles.filter((b) => b.y >= -b.size);
        }
        requestAnimationFrame(loop);
      }

      Juegos.startScreen(Juegos.bubbleIcon()).then(startLevel);
      requestAnimationFrame((t) => {
        lastTime = t;
        loop(t);
      });
    </script>
  </body>
</html>
