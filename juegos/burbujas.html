<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cazaburbujas</title>
    <link rel="stylesheet" href="../assets/common.css" />
    <style>
      body {
        background: #9ce5ed;
      }

      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .bubble span {
        pointer-events: none;
      }

      .bubble.popping {
        pointer-events: none;
        transition: transform 0.18s ease-out, opacity 0.18s ease-out;
        opacity: 0;
      }

      .world-art {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .bubble-look {
        border: 4px solid #24334b;
        box-shadow: inset 8px 10px 0 #ffffff90, inset -8px -10px 0 #38bdf844;
      }

      .ground {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50px;
        background: #4ade80;
        border-top: 6px solid #22c55e;
      }
    </style>
  </head>
  <body>
    <!-- All scenery is inert and precedes the floating targets. -->
    <svg class="world-art" viewBox="0 0 1366 768" preserveAspectRatio="none" aria-hidden="true">
      <g stroke="#24334b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M90 160 Q70 126 109 116 Q120 62 170 91 Q208 78 222 119 Q270 132 242 160Z" fill="#fff9e8"/>
        <path d="M1010 186 Q980 150 1020 141 Q1040 90 1080 122 Q1120 100 1140 146 Q1186 150 1170 186Z" fill="#fff9e8"/>
        <circle cx="1220" cy="100" r="48" fill="#ffcc47"/>
        <path d="M0 485 Q220 345 460 480 Q770 330 1020 460 Q1220 380 1366 440 V768 H0Z" fill="#74c98b"/>
        <path d="M0 590 Q260 460 500 590 Q850 460 1366 560 V768 H0Z" fill="#42ad83"/>
        <path d="M0 690 Q330 590 650 680 Q1000 580 1366 666 V768 H0Z" fill="#b7df70"/>
        <path d="M100 768 V550 M68 585 Q95 540 100 590 Q130 545 139 581 M1250 768 V548 M1218 586 Q1245 542 1250 590 Q1280 548 1290 581" fill="#48ae78"/>
        <g fill="#ff739e">
          <path d="M100 554 C25 540 60 485 100 514 C130 470 177 520 132 545 Q130 584 100 554Z"/>
          <path d="M1250 552 C1175 538 1210 483 1250 512 C1280 468 1327 518 1282 543 Q1280 582 1250 552Z"/>
        </g>
        <g fill="#ffcc47"><circle cx="103" cy="535" r="17"/><circle cx="1253" cy="533" r="17"/></g>
        <ellipse cx="667" cy="737" rx="230" ry="26" fill="#74cbd9"/>
        <path d="M430 722 Q670 686 904 722" fill="none" stroke="#fff9e8"/>
      </g>
    </svg>
    <script src="../assets/common.js"></script>
    <script>
      // Each level makes bubbles smaller, faster and wobblier.
      const LEVELS = [
        { size: 170, speed: 45, max: 3, wobble: 0 },
        { size: 135, speed: 65, max: 4, wobble: 25 },
        { size: 105, speed: 85, max: 5, wobble: 40 },
        { size: 80, speed: 105, max: 6, wobble: 55 },
      ];
      const POPS_PER_LEVEL = 10;
      const SPAWN_EVERY = 0.8; // seconds
      const INSIDE = ["", "", "🐟", "🦋", "⭐", "🐞", "🍓", "🌸"];

      const progress = Juegos.progress(POPS_PER_LEVEL);
      const medals = Juegos.medals();
      Juegos.homeButton();
      Juegos.guardRightClick();

      let level = 0;
      let pops = 0;
      let playing = false;
      let bubbles = [];
      let sinceSpawn = 0;
      let lastTime = 0;

      function spawn() {
        const cfg = LEVELS[level];
        const size = cfg.size * Juegos.random(0.9, 1.1);
        const margin = cfg.wobble + size / 2 + 20;
        const el = document.createElement("div");
        el.className = "bubble bubble-look";
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.fontSize = `${size * 0.4}px`;
        const inside = document.createElement("span");
        inside.textContent = Juegos.pick(INSIDE);
        el.appendChild(inside);

        const bubble = {
          el,
          size,
          baseX: Juegos.random(margin, window.innerWidth - margin),
          y: window.innerHeight,
          x: 0,
          phase: Math.random() * Math.PI * 2,
          speed: cfg.speed * Juegos.random(0.85, 1.15),
          wobble: cfg.wobble,
        };
        // Only the left ("green") button pops a bubble.
        el.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 || !playing) return;
          pop(bubble);
        });
        document.body.appendChild(el);
        bubbles.push(bubble);
      }

      function place(b) {
        b.el.style.transform = `translate(${b.x - b.size / 2}px, ${b.y - b.size / 2}px)`;
      }

      function pop(b) {
        bubbles = bubbles.filter((other) => other !== b);
        b.el.classList.add("popping");
        b.el.style.transform += " scale(1.5)";
        setTimeout(() => b.el.remove(), 200);
        Juegos.sound.pop();
        Juegos.burst(b.x, b.y, "💧", 8);

        pops += 1;
        progress.set(pops);
        if (pops >= POPS_PER_LEVEL) finishLevel();
      }

      async function finishLevel() {
        playing = false;
        bubbles.forEach((b) => b.el.remove());
        bubbles = [];
        const lastLevel = level === LEVELS.length - 1;
        medals.add(lastLevel ? "🏆" : "🏅");
        await Juegos.celebrate(lastLevel ? "🏆" : "🎉");
        level = Math.min(level + 1, LEVELS.length - 1);
        startLevel();
      }

      function startLevel() {
        pops = 0;
        progress.set(0);
        sinceSpawn = SPAWN_EVERY;
        playing = true;
      }

      function loop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        if (playing) {
          sinceSpawn += dt;
          if (sinceSpawn >= SPAWN_EVERY && bubbles.length < LEVELS[level].max) {
            spawn();
            sinceSpawn = 0;
          }
          for (const b of bubbles) {
            b.y -= b.speed * dt;
            b.x = b.baseX + Math.sin(time / 700 + b.phase) * b.wobble;
            place(b);
          }
          // Bubbles that float away just disappear: no penalty, ever.
          const gone = bubbles.filter((b) => b.y < -b.size);
          gone.forEach((b) => b.el.remove());
          bubbles = bubbles.filter((b) => b.y >= -b.size);
        }
        requestAnimationFrame(loop);
      }

      Juegos.startScreen(Juegos.bubbleIcon()).then(startLevel);
      requestAnimationFrame((t) => {
        lastTime = t;
        loop(t);
      });
    </script>
  </body>
</html>
