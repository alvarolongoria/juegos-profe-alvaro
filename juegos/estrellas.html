<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enciende las estrellas</title>
    <link rel="stylesheet" href="../assets/common.css" />
    <style>
      body {
        background: radial-gradient(ellipse at 50% 90%, #6755aa, #24334b 75%);
      }

      .world-art {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .sky-dot {
        pointer-events: none;
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #fff;
        animation: twinkle 3s ease-in-out infinite;
      }

      .moon {
        position: absolute;
        right: 7%;
        bottom: 9%;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: #fef9c3;
        box-shadow: inset -26px -10px 0 #fde68a, 0 0 60px #fef9c355;
      }

      .star-target {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }

      .star-target svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .star-target .body {
        animation: bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
        filter: drop-shadow(0 0 14px #fde047);
      }

      .star-target.holding .body {
        filter: drop-shadow(0 0 30px #fde047);
      }

      .star-target .ring-bg {
        fill: none;
        stroke: #ffffff26;
        stroke-width: 7;
      }

      .star-target .ring {
        fill: none;
        stroke: #facc15;
        stroke-width: 7;
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 50px 50px;
      }

      .start-star {
        width: 220px;
        height: 220px;
      }

      @keyframes twinkle { 50% { opacity: 0.2; } }
      @keyframes bob { 50% { transform: translateY(-4px) rotate(6deg); } }

      @media (prefers-reduced-motion: reduce) {
        .sky-dot, .star-target .body { animation: none; }
        .particle, .confetti, .wrong-button-hint { animation-duration: 0.01ms; animation-delay: 0s; }
      }
    </style>
  </head>
  <body>
    <svg class="world-art" viewBox="0 0 1366 768" preserveAspectRatio="none" aria-hidden="true">
      <g stroke="#24334b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M0 615 L150 365 L300 580 L480 380 L720 640 L940 400 L1160 600 L1290 390 L1366 510 V768 H0Z" fill="#7779ba"/>
        <path d="M107 436 L150 365 L204 444 L170 432 L150 451 L133 425Z M429 444 L480 380 L542 453 L500 440 L479 460 L459 430Z M897 457 L940 400 L992 471 L950 451 L934 470Z" fill="#e4def6"/>
        <path d="M0 694 Q300 590 620 710 Q980 580 1366 675 V768 H0Z" fill="#344e79"/>
        <path d="M0 755 Q320 670 700 753 Q1040 670 1366 730 V768 H0Z" fill="#24334b"/>
        <g transform="translate(1120 160)">
          <circle r="73" fill="#ffdc75"/>
          <path d="M-25 -65 Q-77 15 15 65 Q-60 74 -72 7 Q-78 -43 -25 -65Z" fill="#efb85a" stroke="none"/>
          <circle cx="20" cy="-25" r="13" fill="#efb85a" stroke="none"/>
          <circle cx="39" cy="25" r="9" fill="#efb85a" stroke="none"/>
        </g>
        <g transform="translate(90 565)">
          <path d="M20 102 L60 20 L100 102 M60 20 V110" fill="none" stroke="#ffe6a3" stroke-width="10"/>
          <path d="M10 15 L96 -24 L112 14 L27 53Z" fill="#53d4cb"/>
          <path d="M91 -31 L112 -39 L130 9 L110 17Z" fill="#ff809e"/>
          <circle cx="60" cy="40" r="12" fill="#ffdc75"/>
        </g>
        <path d="M1220 735 V624 L1285 570 L1350 624 V735Z" fill="#9a82cd"/>
        <path d="M1207 625 L1285 554 L1363 625Z" fill="#ff809e"/>
        <path d="M1263 735 V683 Q1285 655 1307 683 V735 M1240 640 H1258 V658 H1240Z M1312 640 H1330 V658 H1312Z" fill="#ffdc75"/>
      </g>
    </svg>
    <script src="../assets/common.js"></script>
    <script>
      // Each level: star size (px), drift speed (px/s) and seconds to hold.
      const LEVELS = [
        { size: 180, speed: 0, hold: 0.9 },
        { size: 150, speed: 60, hold: 0.9 },
        { size: 125, speed: 90, hold: 1.0 },
        { size: 105, speed: 120, hold: 1.1 },
      ];
      const CATCHES_PER_LEVEL = 10;
      const TOP_MARGIN = 120; // keeps the star below the home button and progress bar
      const RING = 2 * Math.PI * 46;

      function starSvg(withRing) {
        const ring = withRing
          ? `<circle class="ring-bg" cx="50" cy="50" r="46" /><circle class="ring" cx="50" cy="50" r="46" stroke-dasharray="${RING}" stroke-dashoffset="${RING}" />`
          : "";
        return `<svg viewBox="0 0 100 100" aria-hidden="true">${ring}
          <g class="body">
            <path d="M50 14 L59 38 L85 39 L65 55 L72 80 L50 66 L28 80 L35 55 L15 39 L41 38Z" fill="#fde047" stroke="#24334b" stroke-width="3" stroke-linejoin="round" />
            <circle cx="43" cy="49" r="3.5" fill="#1e1b4b" /><circle cx="57" cy="49" r="3.5" fill="#1e1b4b" />
            <circle cx="38" cy="56" r="3" fill="#fb923c" opacity=".6" /><circle cx="62" cy="56" r="3" fill="#fb923c" opacity=".6" />
            <path d="M44 57 Q50 63 56 57" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" />
          </g></svg>`;
      }

      for (let i = 0; i < 70; i++) {
        const dot = document.createElement("div");
        dot.className = "sky-dot";
        dot.setAttribute("aria-hidden", "true");
        dot.style.left = `${Math.random() * 100}%`;
        dot.style.top = `${Math.random() * 100}%`;
        dot.style.animationDelay = `${Math.random() * 3}s`;
        document.body.append(dot);
      }

      const progress = Juegos.progress(CATCHES_PER_LEVEL);
      const medals = Juegos.medals();
      Juegos.homeButton();
      Juegos.guardRightClick();

      let level = 0;
      let catches = 0;
      let playing = false;
      let star = null;
      let pointer = null;
      let lastTime = 0;

      // Only the pointer position matters: buttons never catch the star.
      window.addEventListener("pointermove", (e) => (pointer = { x: e.clientX, y: e.clientY }));
      document.addEventListener("pointerleave", () => (pointer = null));

      function randomSpot(size) {
        const half = size / 2 + 10;
        for (let tries = 0; tries < 20; tries++) {
          const spot = {
            x: Juegos.random(half, window.innerWidth - half),
            y: Juegos.random(TOP_MARGIN + half, window.innerHeight - half),
          };
          // A new star never appears right under the pointer.
          if (!pointer || Math.hypot(spot.x - pointer.x, spot.y - pointer.y) > 300) return spot;
        }
        return { x: window.innerWidth / 2, y: (window.innerHeight + TOP_MARGIN) / 2 };
      }

      function place() {
        const half = star.size / 2;
        star.el.style.transform = `translate(${star.x - half}px, ${star.y - half}px)`;
        star.ring.setAttribute("stroke-dashoffset", String(RING * (1 - star.fill)));
        star.el.dataset.fill = star.fill.toFixed(2);
      }

      function newStar() {
        const cfg = LEVELS[level];
        if (star) star.el.remove();
        const el = document.createElement("div");
        el.className = "star-target";
        el.setAttribute("role", "img");
        el.setAttribute("aria-label", "Estrella");
        el.style.width = el.style.height = `${cfg.size}px`;
        el.innerHTML = starSvg(true);
        document.body.append(el);
        const angle = Math.random() * Math.PI * 2;
        star = {
          el,
          ring: el.querySelector(".ring"),
          size: cfg.size,
          fill: 0,
          vx: Math.cos(angle) * cfg.speed,
          vy: Math.sin(angle) * cfg.speed,
          ...randomSpot(cfg.size),
        };
        place();
      }

      async function catchStar() {
        Juegos.sound.star();
        Juegos.burst(star.x, star.y, "✨", 12);
        catches++;
        progress.set(catches);
        if (catches >= CATCHES_PER_LEVEL) {
          playing = false;
          star.el.remove();
          star = null;
          const last = level === LEVELS.length - 1;
          medals.add(last ? "🏆" : "🏅");
          await Juegos.celebrate(last ? "🏆" : "🎉");
          level = Math.min(level + 1, LEVELS.length - 1);
          startLevel();
        } else {
          newStar();
        }
      }

      function startLevel() {
        catches = 0;
        progress.set(0);
        newStar();
        playing = true;
      }

      function loop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        if (playing && star) {
          const cfg = LEVELS[level];
          // Drift and bounce softly off the screen edges.
          const half = star.size / 2;
          star.x += star.vx * dt;
          star.y += star.vy * dt;
          if (star.x < half || star.x > window.innerWidth - half) star.vx *= -1;
          if (star.y < TOP_MARGIN + half || star.y > window.innerHeight - half) star.vy *= -1;
          star.x = Math.min(Math.max(star.x, half), window.innerWidth - half);
          star.y = Math.min(Math.max(star.y, TOP_MARGIN + half), window.innerHeight - half);

          // The ring fills while the pointer stays on the star and empties at half speed.
          const over = pointer && Math.hypot(pointer.x - star.x, pointer.y - star.y) <= half;
          star.el.classList.toggle("holding", !!over);
          star.fill = over ? star.fill + dt / cfg.hold : Math.max(0, star.fill - dt / (cfg.hold * 2));
          if (star.fill >= 1) {
            star.fill = 1;
            place();
            catchStar();
          } else {
            place();
          }
        }
        requestAnimationFrame(loop);
      }

      const startArt = document.createElement("div");
      startArt.className = "start-star";
      startArt.innerHTML = starSvg(false);
      Juegos.startScreen(startArt).then(startLevel);
      requestAnimationFrame((t) => {
        lastTime = t;
        loop(t);
      });
    </script>
  </body>
</html>
