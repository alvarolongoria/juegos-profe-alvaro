<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fábrica de monstruos</title>
  <link rel="stylesheet" href="../assets/common.css" />
  <style>
    body { background: #d8eee9; touch-action: none; }
    .factory { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .monster { isolation: isolate; }
    .monster::before, .monster::after { border: 5px solid #24334b; }
    .monster .freckles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .part svg, .slot svg { width: 84px; height: 76px; pointer-events: none; }
    .slot span { display: grid; place-items: center; }
    .tray { border: 4px solid #24334b; }
    .part { border: 3px solid #24334b; }
    .slot { border-color: #24334b; }
    .monster.monster { border-color: #24334b; }
    .monster { position: absolute; left: calc(50% - 180px); top: 23%; width: 360px; height: 350px; border: 8px solid #ffffff99; box-shadow: inset -15px -15px 0 #00000012, 0 12px 0 #00000015; }
    .monster::before, .monster::after { content: ''; position: absolute; bottom: -28px; width: 90px; height: 50px; background: inherit; border-radius: 50%; z-index: -1; }
    .monster::before { left: 20px; } .monster::after { right: 20px; }
    .slot { position: absolute; width: 100px; height: 88px; display: grid; place-items: center; border: 4px dashed #fff; border-radius: 25px; background: #ffffff55; box-shadow: 0 0 18px #fff9; font-size: 58px; animation: glow 2s ease-in-out infinite alternate; }
    .slot span { opacity: .28; }
    .slot.filled { border-style: solid; animation: none; background: #ffffffbb; }
    .slot.filled span { opacity: 1; }
    .tray { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; padding: 16px 24px; border-radius: 40px; background: #fff9; box-shadow: 0 8px 0 #0002; }
    .part { width: 100px; height: 100px; display: grid; place-items: center; font-size: 66px; border-radius: 24px; background: white; box-shadow: 0 5px 0 #0002; touch-action: none; transition: transform .28s ease; position: relative; }
    .part.held { z-index: 60; transition: none; }
    .part.placed { visibility: hidden; pointer-events: none; }
    .dancing { animation: dance .7s ease-in-out; }
    @keyframes glow { to { box-shadow: 0 0 28px #fff; } }
    @keyframes dance { 25% { transform: rotate(-7deg) translateY(-12px); } 75% { transform: rotate(7deg) translateY(-12px); } }
    @media (max-height: 650px) { .monster { top: 18%; height: 300px; transform: scale(.85); transform-origin: top center; } .tray { bottom: 12px; padding: 10px; } }
    @media (max-width: 650px) { .tray { gap: 6px; padding: 10px; } .part { width: 65px; height: 80px; font-size: 48px; } .progress { top: 100px; } .progress span { font-size: 23px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <svg class="factory" viewBox="0 0 1366 768" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><pattern id="tiles" width="100" height="90" patternUnits="userSpaceOnUse"><path d="M0 90V0H100" fill="none" stroke="#b7d9d4" stroke-width="3"/></pattern></defs>
    <path fill="url(#tiles)" d="M0 0h1366v768H0z"/>
    <g stroke="#24334b" stroke-width="7" stroke-linejoin="round">
      <path d="M0 635h1366v133H0z" fill="#70b9b5"/>
      <path d="M-30 90h220v225h100" fill="none" stroke="#24334b" stroke-width="48"/>
      <path d="M-30 90h220v225h100" fill="none" stroke="#ffbf69" stroke-width="34"/>
      <path d="M1160-20v275h240" fill="none" stroke="#24334b" stroke-width="48"/>
      <path d="M1160-20v275h240" fill="none" stroke="#ad9df0" stroke-width="34"/>
      <rect x="80" y="398" width="210" height="205" rx="26" fill="#fff5da"/>
      <rect x="105" y="425" width="160" height="75" rx="15" fill="#24334b"/>
      <path d="m122 468 28-20 28 30 30-35 38 22" fill="none" stroke="#69dfbd"/>
      <circle cx="130" cy="548" r="17" fill="#fb7d83"/><circle cx="191" cy="548" r="17" fill="#ffcc58"/>
      <path d="M1060 600V402h230v198" fill="#7695d3"/>
      <rect x="1085" y="430" width="180" height="80" rx="16" fill="#fff5da"/>
      <circle cx="1125" cy="470" r="15" fill="#54c8aa"/><path d="M1165 456h70m-70 28h50" stroke="#24334b"/>
      <path d="M1030 600h295v37h-295z" fill="#ffbf69"/>
      <path d="M325 655h716" stroke="#fff5da" stroke-dasharray="25 22"/>
    </g>
  </svg>
  <div class="monster" aria-label="Monstruo"></div>
  <div class="tray" aria-label="Piezas para arrastrar"></div>
  <script src="../assets/common.js"></script>
  <script>
    const LEVELS = [{ slots: 3, tolerance: 65 }, { slots: 4, tolerance: 45 }, { slots: 5, tolerance: 20 }];
    const PARTS = [['🎩', '👀', '👄', '🎀', '👃'], ['👑', '👓', '👅', '🌸', '⭐'], ['🎀', '👀', '👄', '🍀', '👃']];
    const POSITIONS = [[122, -40], [122, 65], [122, 220], [12, 150], [232, 150]];
    const COLORS = ['#4ade80', '#fb923c', '#38bdf8', '#f472b6'];
    const monster = document.querySelector('.monster');
    const tray = document.querySelector('.tray');
    const progress = Juegos.progress(10);
    const medals = Juegos.medals();
    Juegos.homeButton();
    Juegos.guardRightClick();
    let level = 0;
    let successes = 0;
    let generation = -1;
    let placed = 0;
    let playing = false;
    let active = null;

    // Original vector parts retain the existing slot identifiers and hit rectangles.
    const ART = {
      '🎩': '<path d="M20 65h60M30 62l-4-43h48l-4 43" fill="#8166ca"/><path d="M29 48h42" stroke="#ffcc58" stroke-width="10"/>',
      '👑': '<path d="m18 28 20 15 12-25 12 25 20-15-8 41H26z" fill="#ffcc58"/>',
      '👀': '<ellipse cx="32" cy="45" rx="20" ry="27" fill="white"/><ellipse cx="70" cy="45" rx="20" ry="27" fill="white"/><path d="M38 40v13m26-13v13" stroke-width="10"/>',
      '👓': '<circle cx="28" cy="45" r="21" fill="#b9eeef"/><circle cx="73" cy="45" r="21" fill="#b9eeef"/><path d="M49 43h3M7 39H0m94 0h6"/>',
      '👄': '<path d="M12 35q38 62 76 0z" fill="#24334b"/><path d="M24 38h52l-8 14H32z" fill="white"/><path d="M38 62q12-17 25 0" fill="#ff7d92"/>',
      '👅': '<path d="M12 30q38 44 76 0" fill="none"/><path d="M38 44v20q12 22 25 0V44" fill="#ff7d92"/>',
      '🎀': '<path d="M48 45 14 20v51l34-21m5-5 33-25v51L53 50" fill="#ff7d92"/><circle cx="50" cy="47" r="12" fill="#ffcc58"/>',
      '🌸': '<path d="M50 30C20-4 5 30 28 44 0 65 32 91 50 64c18 27 50 1 22-20C95 30 80-4 50 30Z" fill="#ff7d92"/><circle cx="50" cy="47" r="13" fill="#ffcc58"/>',
      '⭐': '<path d="m50 9 12 26 29 4-21 21 5 28-25-14-25 14 5-28L9 39l29-4z" fill="#ffcc58"/>',
      '🍀': '<path d="M50 45C0 5 10 80 47 51 12 92 90 94 54 51 95 80 99 5 50 45Z" fill="#54c8aa"/>',
      '👃': '<path d="M43 20 25 61q25 21 50 0L57 20" fill="#ffbf69"/><path d="M39 64h1m20 0h1" stroke-width="8"/>'
    };
    function partArt(symbol) {
      return `<svg viewBox="0 0 100 90" aria-hidden="true"><g stroke="#24334b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${ART[symbol]}</g></svg>`;
    }
    function newMonster() {
      generation++;
      placed = 0;
      monster.classList.remove('dancing');
      monster.innerHTML = '<svg class="freckles" viewBox="0 0 360 350" aria-hidden="true"><g fill="#24334b" opacity=".16"><circle cx="42" cy="88" r="15"/><circle cx="65" cy="117" r="9"/><circle cx="313" cy="228" r="15"/><circle cx="290" cy="260" r="9"/></g></svg>';
      tray.replaceChildren();
      monster.style.background = COLORS[generation % COLORS.length];
      monster.style.borderRadius = ['45% 45% 30% 30%', '35% 50% 35% 50%', '45% 30% 45% 30%'][generation % 3];
      PARTS[generation % PARTS.length].slice(0, LEVELS[level].slots).forEach((emoji, index) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.slot = index;
        slot.style.left = `${POSITIONS[index][0]}px`;
        slot.style.top = `${POSITIONS[index][1]}px`;
        const picture = document.createElement('span');
        picture.innerHTML = partArt(emoji);
        slot.append(picture);
        monster.append(slot);
        const part = document.createElement('div');
        part.className = 'part';
        part.dataset.slot = index;
        part.innerHTML = partArt(emoji);
        part.setAttribute('aria-label', 'Arrastra la pieza a su silueta');
        tray.append(part);
        attachDrag(part, slot);
      });
    }

    // Pointer capture keeps the piece held even when the pointer leaves its tray.
    function attachDrag(part, slot) {
      let startX, startY;
      part.addEventListener('pointerdown', event => {
        if (event.button !== 0 || !playing || active || part.classList.contains('placed')) return;
        event.preventDefault();
        active = part;
        startX = event.clientX;
        startY = event.clientY;
        part.setPointerCapture(event.pointerId);
        part.classList.add('held');
        part.style.transform = 'scale(1.12)';
      });
      part.addEventListener('pointermove', event => {
        if (active !== part) return;
        part.style.transform = `translate(${event.clientX - startX}px, ${event.clientY - startY}px) scale(1.12)`;
      });
      function reset() {
        if (active !== part) return;
        active = null;
        part.classList.remove('held');
        part.style.transform = '';
      }
      part.addEventListener('pointercancel', reset);
      part.addEventListener('lostpointercapture', reset);
      part.addEventListener('pointerup', event => {
        if (active !== part || event.button !== 0) return;
        const box = slot.getBoundingClientRect();
        const tolerance = LEVELS[level].tolerance;
        // Overlapping generous hit areas still belong to the nearest silhouette.
        const distance = rect => Math.hypot(event.clientX - rect.x - rect.width / 2, event.clientY - rect.y - rect.height / 2);
        const nearest = [...monster.querySelectorAll('.slot')].every(other => distance(box) <= distance(other.getBoundingClientRect()));
        const matches = nearest && event.clientX >= box.left - tolerance && event.clientX <= box.right + tolerance && event.clientY >= box.top - tolerance && event.clientY <= box.bottom + tolerance;
        reset();
        if (!matches) { Juegos.sound.oops(); return; }
        part.classList.add('placed');
        slot.classList.add('filled');
        Juegos.sound.star();
        Juegos.burst(box.x + box.width / 2, box.y + box.height / 2);
        placed++;
        successes++;
        progress.set(successes);
        if (placed === LEVELS[level].slots) monster.classList.add('dancing');
        if (successes === 10) finishLevel();
        else if (placed === LEVELS[level].slots) {
          playing = false;
          setTimeout(() => { newMonster(); playing = true; }, 750);
        }
      });
    }
    async function finishLevel() {
      playing = false;
      const last = level === LEVELS.length - 1;
      medals.add(last ? '🏆' : '🏅');
      await Juegos.celebrate(last ? '🏆' : '🎉');
      level = Math.min(level + 1, LEVELS.length - 1);
      startLevel();
    }
    function startLevel() {
      successes = 0;
      progress.set(0);
      newMonster();
      playing = true;
    }
    const preview = document.createElement('div');
    preview.innerHTML = '<svg width="160" height="150" viewBox="0 0 160 150" aria-hidden="true"><g stroke="#24334b" stroke-width="6" stroke-linejoin="round"><path d="M25 130V65C25 0 135 0 135 65v65Z" fill="#54c8aa"/><circle cx="60" cy="60" r="17" fill="white"/><circle cx="105" cy="60" r="17" fill="white"/><path d="M61 58v7m43-7v7m-46 28q24 24 48 0" fill="none" stroke-linecap="round"/></g></svg>';
    Juegos.startScreen(preview).then(startLevel);
  </script>
</body>
</html>
